plugins {
    id "org.mifos.conventions.gradle.boot.core.transport.implementation"
}

dependencies {
    // TODO: fix this; this build module should reside in a separate Git repo
    implementation "org.mifos.commons.boot:mifos-commons-boot-transport-rest-imperative:0.1.0-SNAPSHOT"

    implementation "tools.jackson.datatype:jackson-datatype-moneta"
    implementation "tools.jackson.datatype:jackson-datatype-eclipse-collections"

    implementation "io.swagger.core.v3:swagger-annotations-jakarta"

    implementation "org.springdoc:springdoc-openapi-starter-common"

    implementation "org.springframework.boot:spring-boot-starter-webmvc"

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-api"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui"

    testImplementation "org.springframework.restdocs:spring-restdocs-mockmvc"
    testImplementation "org.springframework.restdocs:spring-restdocs-asciidoctor"
    testImplementation "org.springframework.restdocs:spring-restdocs-webtestclient"
}
