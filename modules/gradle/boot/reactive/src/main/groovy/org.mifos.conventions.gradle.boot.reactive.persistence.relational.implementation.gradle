plugins {
    id "org.mifos.conventions.gradle.boot.core.persistence.implementation"
}

dependencies {
    implementation "org.mifos.commons.boot:mifos-commons-boot-persistence:0.1.0-SNAPSHOT"
    api "org.springframework.boot:spring-boot-starter-data-r2dbc"
    api "com.infobip:infobip-spring-data-r2dbc-querydsl-boot-starter"
    implementation "io.r2dbc:r2dbc-proxy"
    implementation "org.postgresql:r2dbc-postgresql"

    testImplementation "org.mifos.commons.boot:mifos-commons-boot-testing:0.1.0-SNAPSHOT"
}
