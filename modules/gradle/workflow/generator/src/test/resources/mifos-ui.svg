<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="auto" style="font-family: 'Inter', 'Segoe UI', Arial, sans-serif; background-color: #0F172A;">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0F172A" />
<stop offset="100%" stop-color="#111827" />
